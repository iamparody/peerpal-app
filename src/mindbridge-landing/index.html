    <!-- Loading favicon: shows a subtle spinner in the tab while the page loads,
         then swaps to the static PeerPal mark. Falls back to the static icon
         when JS is off, canvas is unavailable, or reduced motion is requested. -->
    <script>
      (function () {
        var head = document.head;
        var done = false;
        function setIcon(href, type) {
          var l = document.getElementById('favicon-dyn');
          if (!l) { l = document.createElement('link'); l.id = 'favicon-dyn'; l.rel = 'icon'; head.appendChild(l); }
          l.type = type; l.href = href;
        }
        function finish() {
          if (done) return; done = true;
          if (timer) clearInterval(timer);
          setIcon('/favicon.svg', 'image/svg+xml');
        }
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext && canvas.getContext('2d');
        var timer = null;
        if (ctx && !reduce) {
          canvas.width = canvas.height = 64;
          var angle = 0;
          function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          }
          function draw() {
            if (done) return;
            ctx.clearRect(0, 0, 64, 64);
            roundRect(1, 1, 62, 62, 15); ctx.fillStyle = '#3a2c25'; ctx.fill();
            ctx.lineWidth = 5; ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(223,201,180,0.22)';
            ctx.beginPath(); ctx.arc(32, 32, 14, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = '#e8c48f';
            ctx.beginPath(); ctx.arc(32, 32, 14, angle, angle + Math.PI * 0.6); ctx.stroke();
            angle += 0.5;
            try { setIcon(canvas.toDataURL('image/png'), 'image/png'); } catch (e) { finish(); }
          }
          draw();
          timer = setInterval(draw, 90);
        }
        if (document.readyState === 'complete') finish();
        else window.addEventListener('load', finish);
        setTimeout(finish, 8000);
      })();
    </script>
