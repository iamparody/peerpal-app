name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Render production deploy
    runs-on: ubuntu-latest
    environment: production   # requires manual approval gate in GitHub → Settings → Environments → production
    steps:
      - name: Deploy and verify production
        run: |
          curl -fsS -X POST "$HOOK"
          echo "Waiting for Render to deploy..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health")
            echo "Attempt $i: /health → $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Production health check failed after 6 minutes"
          exit 1
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
