name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Render staging deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_STAGING not configured — skipping staging deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

      - name: Wait for Render to spin up
        if: ${{ env.RENDER_DEPLOY_HOOK_STAGING != '' }}
        run: sleep 90
        env:
          RENDER_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

      - name: Health check staging
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_BACKEND_URL not configured — skipping health check"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health")
          echo "Staging /health returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Staging health check failed"
            exit 1
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_BACKEND_URL }}
